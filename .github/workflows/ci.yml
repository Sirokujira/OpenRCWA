# OpenRCWA (処理ロジック) CI — CPU 版ソルバーのビルド + サンプルのスモーク実行。
# CUDA/MPI/MKL/TBB はランナーに無くてもビルド可能 (optional 化済み)。
# RCWA コア (rcwa/*.cpp) は orcwa に結線済み: grating サンプルで
# 回折効率の計算とエネルギー保存 (R+T=1) を検証する。
name: CI

on:
  push:
    branches: [ main, "claude/**" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ main ]

jobs:
  build-cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          sudo apt-get update
          # LAPACK/LAPACKE/Eigen は MKL 非搭載環境での RCWA コアのフォールバックに必要
          sudo apt-get install -y cmake gcc g++ libhdf5-dev \
            liblapack-dev liblapacke-dev libeigen3-dev

      - name: Configure (CPU only)
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF

      - name: Build orcwa / orcwa_post
        run: cmake --build build -j"$(nproc)"

      - name: Smoke test — solver (dipole sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/dipole.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/orcwa" -n 2 dipole.ofd
          grep -q "normal end" orcwa.log
          test -s orcwa.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/orcwa_post" -n 2 dipole.ofd

      - name: Smoke test — RCWA (grating sample)
        run: |
          mkdir -p /tmp/smoke-rcwa && cp data/sample/grating.ofd /tmp/smoke-rcwa/
          cd /tmp/smoke-rcwa
          "$GITHUB_WORKSPACE/bin/orcwa" -n 2 grating.ofd
          grep -q "normal end" orcwa.log
          # 全周波数・両偏波でエネルギー保存 (R+T=1) を確認。
          # LAPACKE 経路の数値誤差は ~1e-7 だが、BLAS/アーキテクチャ差の
          # 安全余裕をみて許容 |R+T-1| <= 3e-3
          awk -F, 'NR>1 { if ((($3+$4)-1)^2 > 9e-6 || (($5+$6)-1)^2 > 9e-6) \
            { print "energy not conserved:", $0; exit 1 } }' rcwa_efficiency.csv

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: orcwa-linux-x64
          path: |
            bin/orcwa
            bin/orcwa_post

      # タグ (v*) push 時は Release にバイナリを添付する。
      # OpenFDTD-X (GUI) や統合テストはここから取得できる (公開リポジトリ)。
      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf orcwa-linux-x64.tar.gz -C bin orcwa orcwa_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: orcwa-linux-x64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-rcwa/*.log
          if-no-files-found: ignore

  # macOS (Apple Silicon)。AppleClang は OpenMP を同梱しないため、
  # Homebrew の libomp を明示指定して find_package(OpenMP) を通す。
  # RCWA コアの固有値計算は Homebrew の lapack (keg-only) の LAPACKE を使う:
  # Eigen の ComplexEigenSolver フォールバックは ±m 次数の縮退固有値で
  # 固有ベクトル基底が不良条件になることがあり、回折効率が不安定になるため。
  build-macos:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      - name: Install dependencies
        run: brew install libomp hdf5 eigen lapack

      - name: Configure (CPU only)
        run: |
          OMP="$(brew --prefix libomp)"
          LAP="$(brew --prefix lapack)"
          cmake -B build -DCMAKE_BUILD_TYPE=Release -DWITH_CUDA=OFF -DWITH_MPI=OFF \
            -DLAPACKE_INCLUDE_DIR="${LAP}/include" \
            -DLAPACKE_LIBRARY="${LAP}/lib/liblapacke.dylib" \
            -DOpenMP_C_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_C_LIB_NAMES=omp \
            -DOpenMP_CXX_FLAGS="-Xclang -fopenmp -I${OMP}/include" \
            -DOpenMP_CXX_LIB_NAMES=omp \
            -DOpenMP_omp_LIBRARY="${OMP}/lib/libomp.dylib"

      - name: Build orcwa / orcwa_post
        run: cmake --build build -j"$(sysctl -n hw.ncpu)"

      - name: Smoke test — solver (dipole sample)
        run: |
          mkdir -p /tmp/smoke && cp data/sample/dipole.ofd /tmp/smoke/
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/orcwa" -n 2 dipole.ofd
          grep -q "normal end" orcwa.log
          test -s orcwa.out

      - name: Smoke test — post processor
        run: |
          cd /tmp/smoke
          "$GITHUB_WORKSPACE/bin/orcwa_post" -n 2 dipole.ofd

      - name: Smoke test — RCWA (grating sample)
        run: |
          mkdir -p /tmp/smoke-rcwa && cp data/sample/grating.ofd /tmp/smoke-rcwa/
          cd /tmp/smoke-rcwa
          "$GITHUB_WORKSPACE/bin/orcwa" -n 2 grating.ofd
          grep -q "normal end" orcwa.log
          # 全周波数・両偏波でエネルギー保存 (R+T=1) を確認。
          # LAPACKE 経路の数値誤差は ~1e-7 だが、BLAS/アーキテクチャ差の
          # 安全余裕をみて許容 |R+T-1| <= 3e-3
          awk -F, 'NR>1 { if ((($3+$4)-1)^2 > 9e-6 || (($5+$6)-1)^2 > 9e-6) \
            { print "energy not conserved:", $0; exit 1 } }' rcwa_efficiency.csv

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: orcwa-macos-arm64
          path: |
            bin/orcwa
            bin/orcwa_post

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: tar czf orcwa-macos-arm64.tar.gz -C bin orcwa orcwa_post

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: orcwa-macos-arm64.tar.gz

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-macos
          path: |
            /tmp/smoke/*.log
            /tmp/smoke-rcwa/*.log
          if-no-files-found: ignore

  # Windows (MSVC)。依存は vcpkg (x64-windows-static-md 静的リンク) で導入し、
  # DLL 同梱不要の自己完結 exe を生成する。ビルドは MSVC 環境 + Ninja。
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 90
    permissions:
      contents: write   # タグ push 時の Release 添付に使用
    steps:
      - uses: actions/checkout@v4

      # hdf5 の既定機能 szip は libaec を gitlab.dkrz.de から取得するが
      # 429 で落ちることがあるため、必要な core+zlib のみに絞る
      - name: Install dependencies (vcpkg)
        run: vcpkg install "hdf5[core,zlib]:x64-windows-static-md" eigen3:x64-windows-static-md --recurse

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure (CPU only)
        run: >
          cmake -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          -DWITH_CUDA=OFF -DWITH_MPI=OFF
          -DWITH_RCWA=OFF
          "-DCMAKE_TOOLCHAIN_FILE=$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"
          -DVCPKG_TARGET_TRIPLET=x64-windows-static-md

      - name: Build orcwa / orcwa_post
        run: cmake --build build

      - name: Smoke test — solver (dipole sample)
        run: |
          New-Item -ItemType Directory -Force smoke | Out-Null
          Copy-Item data/sample/dipole.ofd smoke/
          Set-Location smoke
          & "$env:GITHUB_WORKSPACE\bin\orcwa.exe" -n 2 dipole.ofd
          Write-Host ("orcwa exit code: 0x{0:X8}" -f $LASTEXITCODE)
          if (Test-Path orcwa.log) { Get-Content orcwa.log -Tail 5 }
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path orcwa.log -Pattern "normal end" -Quiet)) { Write-Error "no normal end"; exit 1 }
          if ((Get-Item orcwa.out).Length -eq 0) { Write-Error "empty orcwa.out"; exit 1 }
          & "$env:GITHUB_WORKSPACE\bin\orcwa_post.exe" -n 2 dipole.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - name: Smoke test — RCWA (grating sample)
        run: |
          New-Item -ItemType Directory -Force smoke-rcwa | Out-Null
          Copy-Item data/sample/grating.ofd smoke-rcwa/
          Set-Location smoke-rcwa
          & "$env:GITHUB_WORKSPACE\bin\orcwa.exe" -n 2 grating.ofd
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (-not (Select-String -Path orcwa.log -Pattern "normal end" -Quiet)) { exit 1 }
          # 全周波数・両偏波でエネルギー保存 (|R+T-1| <= 3e-3) を確認
          $rows = Import-Csv rcwa_efficiency.csv
          foreach ($r in $rows) {
            if ([math]::Abs([double]$r.R_TE + [double]$r.T_TE - 1) -gt 3e-3 -or
                [math]::Abs([double]$r.R_TM + [double]$r.T_TM - 1) -gt 3e-3) {
              Write-Error "energy not conserved"; exit 1
            }
          }

      - name: Upload binaries (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: orcwa-windows-x64
          path: |
            bin/orcwa.exe
            bin/orcwa_post.exe

      - name: Package for release
        if: startsWith(github.ref, 'refs/tags/v')
        run: Compress-Archive -Path bin/orcwa.exe, bin/orcwa_post.exe -DestinationPath orcwa-windows-x64.zip

      - name: Attach binaries to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: orcwa-windows-x64.zip

      - name: Upload logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: smoke-logs-windows
          path: |
            smoke/*.log
            smoke-rcwa/*.log
          if-no-files-found: ignore
